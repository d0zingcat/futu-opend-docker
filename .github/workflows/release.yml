name: Build and publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/d0zingcat/futu-opend-docker:stable,ghcr.io/d0zingcat/futu-opend-docker:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/d0zingcat/futu-opend-docker
          provenance: mode=max
          sbom: true
