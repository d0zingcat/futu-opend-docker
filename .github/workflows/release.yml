name: Build and publish image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7
concurrency:
  group: publish-dokploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/d0zingcat/futu-opend-docker
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=stable
            type=sha,format=short,prefix=sha-
            type=sha,format=long,prefix=sha-
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ${{ secrets.DOKPLOY_BUILD_ARGS }}
          secrets: ${{ secrets.DOKPLOY_BUILD_SECRETS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Notify Dokploy
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.DOKPLOY_AUTO_DEPLOY == 'true' }}
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo 'Required Dokploy webhook secret is missing.' >&2
            exit 1
          fi
          status=$(curl --fail --silent --show-error --max-time 60 \
            --output /dev/null --request POST "$DOKPLOY_DEPLOY_URL" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --write-out '%{http_code}')
          case "$status" in
            2??) ;;
            *) echo "Dokploy webhook returned HTTP $status." >&2; exit 1 ;;
          esac
          echo 'Dokploy accepted the deployment webhook; verify application health in Dokploy.'
